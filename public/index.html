<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app">

  <nav class="side" aria-label="Verticals">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Lead Desk</span>
        <span class="brand-co" id="brand-co">Media Payments Group</span>
      </span>
    </div>
    <button class="tab tab-due" type="button" data-tab="due">
      <span class="tab-label">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Due today</span>
      <span class="tab-count pill" id="count-due">0</span>
    </button>
    <button class="tab" type="button" data-tab="all"><span class="tab-label">All leads</span><span class="tab-count" id="count-all">0</span></button>
    <button class="tab" type="button" data-tab="new_week"><span class="tab-label">New this week</span><span class="tab-count accent" id="count-new">0</span></button>
    <div class="side-head">Niches</div>
    <div id="tabs-niches"></div>
    <div class="side-head">Broad</div>
    <div id="tabs-broad"></div>
    <div class="side-foot">
      <span class="avatar" id="avatar">CA</span>
      <span class="who">
        <span class="who-name" id="operator">Chandler Atkinson</span>
        <span class="who-mode" id="mode">Live</span>
      </span>
    </div>
  </nav>

  <main class="main">
    <div class="head">
      <div class="head-left">
        <div class="title-row">
          <h1 id="tab-title">Leads</h1>
          <span class="title-meta" id="tab-meta"></span>
        </div>
        <div class="run-line" id="run-line" role="status"></div>
      </div>

      <section class="counter" aria-label="Conversations today">
        <div class="counter-top">
          <span class="counter-label">Conversations today</span>
          <span class="counter-goal" id="goal-label">Goal 40</span>
        </div>
        <div class="counter-num"><span id="conv-total">0</span><span class="counter-of" id="conv-of">/ 40</span></div>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="conv-bar"></div></div>
        <div class="counter-break" id="conv-break"></div>
        <button class="btn btn-quiet btn-sm" id="copy-tracker" type="button">Copy for tracker</button>
      </section>
    </div>

    <form class="runbar" id="runbar">
      <label class="rb-field">City
        <input id="city-input" type="text" autocomplete="off" placeholder="City or ZIP">
      </label>
      <span class="rb-sep" aria-hidden="true"></span>
      <label class="rb-field">State
        <select id="state-input"></select>
      </label>
      <span class="rb-sep" aria-hidden="true"></span>
      <label class="rb-field">Miles
        <input id="miles-input" type="number" min="1" max="25" step="1" value="9">
      </label>
      <button class="btn btn-dark" id="run-btn" type="submit">Run search</button>
    </form>
    <p class="hint" id="run-hint" hidden>Pick a niche on the left to run a new search.</p>

    <div class="banner" id="banner" hidden></div>

    <div class="tools">
      <div class="tools-left">
        <div class="seg" role="group" aria-label="Filter leads" id="filters"></div>
        <label class="open-toggle">
          <input type="checkbox" id="open-only">Open now only
        </label>
      </div>
      <div class="tools-right">
        <label class="sr-wrap"><span class="sr-only">Search leads or notes</span>
          <input id="search" type="search" placeholder="Search leads or notes">
        </label>
        <button class="btn btn-quiet" id="download-csv" type="button">Export CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table" id="table">
        <div class="thead" aria-hidden="true">
          <span>Score</span><span>Business</span><span>Why it scored</span><span>Phone</span><span>Last touch</span><span></span>
        </div>
        <div id="rows"><div class="state">Loading…</div></div>
      </div>
    </div>

    <footer class="foot">Generate-only outreach. You send it. Contact only businesses you may lawfully reach.</footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
